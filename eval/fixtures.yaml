# Evaluation fixtures (FR-002.14a; FTDD §4.4a). miassist.eval-fixtures/v1.
# Every key carries the prefix; so does every name the creator chooses (a model keeps its Hub name).
# `app_id` and `created_utc` are written by `python -m miassist_eval fixtures create`, run by hand on
# the workstation with the operator approving every gated step in the app (FTASKS 3.2b). Until then
# they are null and `fixtures check` reports each as not created.
#
# Core's recorder reads this same file (miassist_fixtures.filter.AllowedSet.from_fixtures: `prefix`,
# `ids`, `public_repositories`); `ids` and `public_repositories` must equal what `fixtures` lists
# (tests/unit/test_fixtures.py pins it; OVN-miassist-eval-4).
