# Origin: miForge (Onegaishimas/miForge) .github/workflows/sync-to-clean.yml @ e4251e4
# Mode: adapt (docs/REUSE.md). Kept: the private CI gate before any push, the orphan snapshot with
# `Source-Commit:` and `Private-CI: passed` trailers, never moving the mirror backwards, verifying the
# published clone, dispatching the mirror's manual deploy.
# Changed (Foundation 3.3): repository guards name Onegaishimas/miAssist; REQUIRED_WORKFLOWS =
# backend-tests.yml, manual-ci.yml (docs-check.yml is the named exemption: it gates no image); the
# strip also removes `scripts/private/`, every `cassettes` directory (the root is `tests/fixtures/cassettes/`)
# and then REFUSES to publish anything cassette-like through .github/scripts/cassette_strip.py, which the
# verify step also runs (A22; R1 review fix OR1-001-3; R2 review fix OR2-001-5), and every `docs/` entry
# except `schemas/` and `REUSE.md` (R1M-24). `tests/unit/test_mirror_strip.py` runs the strip step's and the
# verify step's scripts from this file.
name: Sync to Clean Repository


on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    name: Require private CI to have passed
    if: github.repository == 'Onegaishimas/miAssist' || github.repository == 'Onegaishimas/miassist'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read     # list this commit's workflow runs and their jobs
      contents: read
    outputs:
      sha: ${{ steps.gate.outputs.sha }}
    env:
      REQUIRED_WORKFLOWS: |
        backend-tests.yml
        manual-ci.yml
        eval-tier1a.yml
    steps:
      - name: Checkout source repository (full history, for ancestry checks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the gate's one dependency
        run: pip install pyyaml==6.0.3

      - name: Require private CI to have passed for this commit
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: python .github/scripts/private_ci_gate.py

  sync:
    needs: gate
    if: github.repository == 'Onegaishimas/miAssist' || github.repository == 'Onegaishimas/miassist'

    runs-on: ubuntu-latest

    concurrency:
      group: sync-to-clean-mirror
      cancel-in-progress: false

    env:
      MIRROR: hitsainet/miAssist

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ needs.gate.outputs.sha }}

      - name: Never move the mirror backwards
        id: order
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          HEAD_NOW="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          MSG="$(GH_TOKEN="${SYNC_TOKEN}" gh api "repos/${MIRROR}/commits/main" --jq .commit.message 2>/dev/null || true)"
          PUBLISHED="$(git interpret-trailers --parse <<< "$MSG" | sed -n '/^Source-Commit: /{s///p;q;}')"
          if [ "$SHA" = "$HEAD_NOW" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "${SHA} is main's head - publishing."
          elif [ -z "$PUBLISHED" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"; echo "The mirror records no Source-Commit yet - publishing."
          else
            STATUS="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PUBLISHED}...${SHA}" --jq .status)"
            case "$STATUS" in
              ahead|identical)
                echo "publish=true" >> "$GITHUB_OUTPUT"; echo "${SHA} is ${STATUS} of the published ${PUBLISHED} - publishing." ;;
              *)
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Not publishing ${SHA}: it is ${STATUS} relative to the mirror's ${PUBLISHED}, and main has moved on to ${HEAD_NOW}." ;;
            esac
          fi

      - name: Remove excluded files and folders
        if: steps.order.outputs.publish != 'false'
        run: |
          set -euo pipefail
          rm -rf 0xcc/
          rm -rf .claude/
          rm -f CLAUDE.md AGENT.md GEMINI.md
          rm -rf backups/
          rm -rf scripts/private/
          # Removes every `cassettes` directory (any case; the root is tests/fixtures/cassettes/), then
          # REFUSES the publish (exit 1, set -e stops the job before the push) when any remaining file is
          # unreadable, oversized, an archive, names the cassette format in any encoding or carries
          # request/answer records. The verify step below runs the SAME matcher (R1 review fix OR1-001-3;
          # R2 review fix OR2-001-5: fail closed, never strip-and-continue).
          python3 .github/scripts/cassette_strip.py --strip .
          if [ -d docs ]; then
            find docs/ -mindepth 1 -maxdepth 1 ! -name schemas ! -name REUSE.md -exec rm -rf {} +
          fi
          echo "Removed excluded files"

      - name: Build the orphan snapshot
        if: steps.order.outputs.publish != 'false'
        env:
          SOURCE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"

          git checkout --orphan clean
          git add -A
          git commit -m "miAssist ${VERSION} — filtered snapshot from ${SOURCE_SHA::7}" \
            --trailer "Source-Commit: ${SOURCE_SHA}" --trailer "Private-CI: passed"

          PARENTS="$(git rev-list --parents -n1 HEAD | wc -w)"
          if [ "$PARENTS" -ne 1 ]; then
            echo "::error::orphan commit has parents — refusing to push"
            exit 1
          fi
          echo "Built orphan snapshot: $(git rev-parse --short HEAD)"

      - name: Push to clean repository
        if: steps.order.outputs.publish != 'false'
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          if [ -z "${SYNC_TOKEN}" ]; then
            echo "::error::HITSAINET_SYNC is not set on this repo, so nothing can be pushed"
            exit 1
          fi
          git config --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all http.https://github.com/.extraheader || true

          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${MIRROR}.git"
          git push --force "$REMOTE" clean:main

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            git tag -f "$TAG" HEAD
            git push --force "$REMOTE" "refs/tags/${TAG}"
            echo "Tagged the orphan snapshot as ${TAG}"
          fi

          for ref in $(git ls-remote --tags "$REMOTE" | awk '{print $2}' | grep -v '\^{}$' || true); do
            T="${ref#refs/tags/}"
            git tag -f "$T" HEAD
            git push --force "$REMOTE" "refs/tags/${T}"
            echo "Retargeted stale tag ${T} onto the snapshot"
          done

      - name: Verify the published mirror
        if: steps.order.outputs.publish != 'false'
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          REMOTE="https://x-access-token:${SYNC_TOKEN}@github.com/${MIRROR}.git"
          rm -rf /tmp/verify
          git clone --quiet "$REMOTE" /tmp/verify
          cd /tmp/verify

          FAILED=0

          COMMITS="$(git rev-list --all --count)"
          echo "Published commits: ${COMMITS}"
          if [ "$COMMITS" -ne 1 ]; then
            echo "::error::mirror has ${COMMITS} commits; a snapshot must have exactly 1"
            echo "::error::a ref other than main is probably anchoring old history:"
            git show-ref | sed 's/^/    /'
            FAILED=1
          fi

          for p in 0xcc .claude CLAUDE.md AGENT.md GEMINI.md backups scripts/private tests/fixtures/cassettes docs/reviews; do
            if [ -n "$(git log --all --oneline -- "$p" 2>/dev/null)" ]; then
              echo "::error::LEAK — '${p}' is present in published history"
              FAILED=1
            fi
          done

          for p in README.md LICENSE manual/docusaurus.config.ts manual/package-lock.json docs/schemas/README.md docs/REUSE.md; do
            if [ ! -e "$p" ]; then
              echo "::error::MISSING — '${p}' must be published but is absent"
              FAILED=1
            fi
          done

          if ! python3 "${GITHUB_WORKSPACE}/.github/scripts/cassette_strip.py" --check . ; then
            echo "::error::LEAK - a cassette, archive or unreadable file is in the published tree (A22)"
            FAILED=1
          fi

          TRAILERS="$(git log -1 --format='%(trailers:only,unfold)' HEAD)"
          if ! grep -qx "Source-Commit: ${{ needs.gate.outputs.sha }}" <<< "$TRAILERS" \
             || ! grep -qx "Private-CI: passed" <<< "$TRAILERS"; then
            echo "::error::the published snapshot lacks its Source-Commit / Private-CI trailers;"
            echo "::error::the mirror's image build will refuse it"
            FAILED=1
          fi

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::mirror verification FAILED"
            exit 1
          fi
          echo "Mirror verified: 1 commit, no excluded path in any commit."

      - name: Dispatch the mirror's manual deploy
        if: steps.order.outputs.publish != 'false'
        env:
          SYNC_TOKEN: ${{ secrets.HITSAINET_SYNC }}
        run: |
          set -euo pipefail
          URL="https://api.github.com/repos/${MIRROR}/actions/workflows/deploy-manual.yml/dispatches"
          for attempt in 1 2 3; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${SYNC_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$URL" -d '{"ref":"main"}')" || CODE="curl-error"
            echo "dispatch attempt ${attempt}: HTTP ${CODE}"
            if [ "$CODE" = "204" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::could not dispatch deploy-manual on ${MIRROR} (last answer: ${CODE}); the published manual will not update"
          exit 1
