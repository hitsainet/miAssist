# Origin: miForge (Onegaishimas/miForge) .github/workflows/sync-main-to-gitops-pilot.yml @ e4251e4
# Mode: adapt (docs/REUSE.md). Merges main into gitops/pilot and converges every file to main
# EXCEPT .argocd-source-miassist.yaml, so Image Updater's digest pin survives (Foundation 3.5).
name: Sync main → gitops/pilot


on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: sync-main-to-gitops-pilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Onegaishimas/miAssist' || github.repository == 'Onegaishimas/miassist'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops/pilot
        uses: actions/checkout@v4
        with:
          ref: gitops/pilot
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Skip if gitops/pilot already contains main
        id: skip_check
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "gitops/pilot already up to date with main — no merge needed"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge main with -X theirs (main is canonical for non-pin files)
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          git merge --no-ff --no-edit -X theirs origin/main || {
            echo "::error::Merge failed despite the -X theirs strategy — needs operator attention"
            git status
            exit 1
          }

      - name: Converge non-pin files to main (drop gitops/pilot-only drift)
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          git checkout origin/main -- . \
            ':(exclude)gitops/pilot/.argocd-source-miassist.yaml'
          if git diff --cached --quiet; then
            echo "Already converged with main (no drift to drop)."
          else
            git --no-pager diff --cached --stat
            git commit --no-edit -m "sync: converge non-pin files to main (drop gitops/pilot drift)"
          fi

      - name: Push, retrying on a race with Image Updater
        if: steps.skip_check.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin gitops/pilot; then
              echo "Pushed successfully on attempt ${attempt}"
              exit 0
            fi
            echo "Push attempt ${attempt} failed; fetching and rebasing"
            git pull --rebase -X theirs origin gitops/pilot || {
              echo "::error::Rebase failed during retry — needs operator attention"
              exit 1
            }
          done
          echo "::error::Push failed after 3 retries — needs operator attention"
          exit 1
