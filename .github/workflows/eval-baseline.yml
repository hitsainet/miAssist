# Feature 002 (Evaluation), FTASKS 9.2: the baseline surface, weekly and on dispatch (TD-7).
# It tests today's app MCP servers (pinned images), not miAssist's code, so it is a named exemption in
# the private gate (tests/unit/test_private_ci_trust.py EXEMPT), never in REQUIRED_WORKFLOWS.
# No model and no key (M13): tier 1a only. Off the mirror (R3M-9).
# The weekly schedule (`schedule: - cron: '17 7 * * 1'`) is added in push 002-P2 with the first
# approved baseline take; before that there is nothing to replay and every run would be red
# (OVN-miassist-eval-14; eval/tests/wiring/test_ci_workflows.py pins the rule against INDEX.json).
name: eval-baseline

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  baseline:
    if: github.repository == 'Onegaishimas/miAssist'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install the evaluation package (exact pins)
        working-directory: eval
        run: python -m pip install -e ".[dev]"

      - name: Tier 1a, baseline surface
        working-directory: eval
        run: python -m miassist_eval run --tier 1a --surface baseline --client scripted
