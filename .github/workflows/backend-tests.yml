# Origin: miForge (Onegaishimas/miForge) .github/workflows/backend-tests.yml @ e4251e4
# Mode: adapt (docs/REUSE.md). Kept: Python 3.13, lint gate, a Postgres 15 service, NO paths filter.
# Changed: one job (miAssist is small), the test database is the service.
#
# NO `paths:` FILTER, on purpose (Foundation task 3.1): a filtered trigger makes "no run" read as
# "passed", and the private gate (sync-to-clean.yml) requires a run for the exact commit.
name: backend-tests

on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          # A test-only value for a throwaway CI database; never a deployed secret.
          POSTGRES_PASSWORD: miassist-test-only
          POSTGRES_DB: miassist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MIASSIST_TEST_DATABASE_URL: postgresql+asyncpg://postgres:miassist-test-only@127.0.0.1:5432/miassist_test
      MIASSIST_REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install (a clean clone installs with no step beyond this; Foundation 10.1)
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: MyPy (strict)
        run: mypy

      - name: Migrate a fresh database to head
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
          POSTGRES_DB: miassist_test
          POSTGRES_PASSWORD: miassist-test-only
          MIASSIST_MIGRATE: "1"
        run: python -m miassist

      - name: pytest (unit, contract, harness)
        run: pytest -n 4 --dist loadfile
