# miAssist's Alembic configuration (PADR ADR-004). The database URL comes from the settings
# (POSTGRES_* or MIASSIST_DATABASE_URL), never from this file.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
