# miAssist's PGDATA volume (PADR ADR-004; Foundation task 5.4).
#
# ⚠ APPLIED BY HAND, NOT LISTED IN kustomization.yaml:
#
#     kubectl apply -f gitops/pilot/storage.yaml
#
# Argo CD's selfHeal reconciling a data-bearing volume is how a database gets deleted by a sync
# (the same exclusion as miForge/gitops/pilot/kustomization.yaml:18-27). A fresh install sits
# Pending until this is applied; it is a one-time prerequisite listed in the Application.
# The directory /data/miassist/pgdata must exist on the node first (operator step, 10.6).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: miassist-pgdata-pv
  labels:
    app.kubernetes.io/part-of: miassist
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: miassist-local-storage
  volumeMode: Filesystem
  hostPath:
    path: /data/miassist/pgdata
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - mcs-lnxhost02
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: miassist-pgdata
  namespace: miassist
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: miassist-local-storage
  volumeName: miassist-pgdata-pv
