# The words of the dataset playbook (004 FPRD §4, §5; FTID §3.1, I1; A8, A25), by key. The
# definition (playbooks/definitions/dataset.json) names the dataset.* keys; the tools read the rest.
# One words file for the playbook (OVN-miassist-pb045-2): steps, states, waits, reasons, the
# approval's four facts, the licence table (I1) and the check texts (C-1 to C-9).
version: 1
texts:
  # -- the definition ---------------------------------------------------------------------------
  dataset.title: "Build, check and publish a dataset"
  dataset.goal: "Go from \"I want a versioned dataset from this\" to a built [[dataset-version]] whose checks are explained in plain words, published to the Hub when you choose."
  dataset.find.title: "Find a public dataset"
  dataset.find.beginner: "Describe the data you want in plain words. miAssist searches the Hub for public datasets only, shows each candidate's licence, size and splits, and previews the best one. Private and gated datasets are left out; how many were left out is said, never which."
  dataset.find.expert: "Hub search (public, ungated only) and one preview of the top candidate."
  dataset.find.done: "At least one public candidate was found."
  dataset.build.title: "Build a version"
  dataset.build.beginner: "Name the dataset you picked. miAssist imports it (public only, its licence shown first), creates the dataset, saves a two-step [[recipe]] that drops exact duplicates and keeps a [[held-out-split]], checks the build plan, and builds a [[dataset-version]]. A large import, a private or gated source, and a recipe that would label rows are the operator's steps."
  dataset.build.expert: "Import (public), dataset, default recipe (dedup_exact, split), plan, build."
  dataset.build.done: "A version of the dataset is built and has rows."
  dataset.check.title: "Check the version"
  dataset.check.beginner: "miAssist builds the version's files, reads the [[leakage]] report and the [[shortcut]] audit, and explains each [[publish-check]] in plain words with the number behind it. Running the publish checks is the operator's step in miDataworks; give miAssist the run id and it explains every check."
  dataset.check.expert: "Version files, existing leakage report and shortcut audit, and a check run the operator started."
  dataset.check.done: "A publish-check run the operator started has completed."
  dataset.publish.title: "Publish to the Hub"
  dataset.publish.beginner: "Ask miDataworks to publish the version to a Hub repository. It is [[visibility]] private unless you say public. The operator approves it in miDataworks, which then re-runs every check, uploads and verifies; miAssist never approves anything."
  dataset.publish.expert: "One gated publish (hub_push); the operator decides; the server runs it."
  dataset.publish.done: "The publish finished, or found nothing new to upload."

  # -- what each state means (data.summary and the status's expected line) ----------------------
  state.nothing_chosen: "Nothing chosen yet: find a dataset first."
  state.source_chosen: "A dataset is named but not imported yet."
  state.awaiting_import: "The import is the operator's step: {detail}"
  state.importing: "The import is running in miDataworks."
  state.imported: "The source is imported; the dataset comes next."
  state.dataset_no_recipe: "The dataset exists; its recipe comes next."
  state.recipe_saved: "The recipe is saved; the build comes next."
  state.awaiting_operator_build: "The build plan labels rows, so the build is the operator's step in miDataworks."
  state.build_waiting: "The build waits for the operator's approval in miDataworks."
  state.building: "The version is building in miDataworks."
  state.build_empty: "The build kept no rows. The largest drop reason: {reason}."
  state.build_failed: "The build failed: {reason}"
  state.version_ready: "Version {number} is built with {rows} rows."
  state.checking: "The version's files or checks are being prepared."
  state.awaiting_publish_checks: "The publish checks have not run yet. Running them is the operator's step."
  state.checked: "The checks the operator ran are complete."
  state.publish_waiting: "The publish waits for the operator's approval in miDataworks."
  state.publishing: "The publish is running in miDataworks."
  state.published: "The version is published to {repo_id}."
  state.rejected: "The operator turned the publish down."
  state.expired: "The publish request expired before anyone decided it."
  state.failed: "The publish did not complete: {reason}"

  # -- what the playbook waits for (waiting[].detail) --------------------------------------------
  wait.import_private: "Import {repo_id} in miDataworks, Sources: it is private, gated or not found on the Hub, so only the operator can import it."
  wait.import_large: "Import {repo_id} in miDataworks, Sources: it is {size}, above miDataworks' confirmation level or of unknown size, so the operator confirms it."
  wait.import_job: "Import job {job_id} is {status} in miDataworks."
  wait.build_labels: "Build the version in miDataworks, Datasets: its plan labels {rows} rows, which can spend a paid classifier, so the operator starts it."
  wait.build_labels_unknown: "Build the version in miDataworks, Datasets: its plan did not say whether it labels rows, and labelling can spend a paid classifier, so the operator starts it."
  wait.build_job: "Build job {job_id} is {status} in miDataworks."
  wait.files_job: "The version's files are building in miDataworks (build {build_id})."
  wait.run_checks: "Run the publish checks in miDataworks, Versions, Publish, then tell me the run id (check_run_id)."
  wait.check_run: "Check run {check_run_id} is {status} in miDataworks."
  wait.approval: "Decide in miDataworks, Approvals, request {approval_id}."
  wait.hub_credential: "Store a Hugging Face token in miDataworks, Settings: the publish check C-2 needs one, and miAssist never takes a token."
  size.unknown: "of unknown size"
  size.bytes: "{bytes} bytes"

  # -- defaults and their reasons (FR-004.11) ----------------------------------------------------
  reason.dedup: "Exact duplicate rows are dropped, so no row counts twice; rows that differ only by spacing are kept."
  reason.split_keep: "The source already has a held-out split, so its own splits are kept."
  reason.split_new: "80 % train, 10 % validation and 10 % test; the last two are held out, so a model is judged on rows it never saw."
  reason.stratify: "Each split keeps the same mix of labels as the whole, because a label column was named."
  reason.private: "Private unless you say public: a private publish is seen only by your Hub account."
  reason.name: "The dataset is named after the source's repository."

  # -- results ------------------------------------------------------------------------------------
  find.line: "{n}. {repo_id}: {rows} rows, licence {licence} ({plain}), splits {splits}."
  find.dropped: "{count} private or gated datasets were left out."
  find.none: "No public dataset matched. Try other words, or a source you imported in miDataworks."
  find.choose: "Build the candidate you want."
  find.choose_first: "Build the first candidate, the best match that was previewed."
  find.rows_unknown: "unknown"
  build.done: "Built version {number}: {rows} rows in {splits}."
  check.headline: "Version {number}: {green} green, {note} note, {amber} amber, {refused} refused, {not_run} not run yet."
  check.private_ok: "It can be published privately now."
  check.public_ok: "It can be published publicly now."
  check.not_run_line: "not run yet (counts as amber)"
  check.amber_blocks: "Amber blocks a public push only."
  check.refused_blocks: "Refused blocks every push."
  check.unknown: "miDataworks says: {text}"
  publish.choose_visibility: "Who may see the published dataset"
  publish.confirm: "Publish with this visibility."
  publish.retry: "Ask again with ask_again, if you still want it published."
  publish.after_failure: "Read the reason in miDataworks, Publishes, then ask again with ask_again."
  end.done: "Your dataset is built, checked and, if you chose, published."
  end.detector: "Use this version for a detector."
  end.status: "See where this dataset stands."
  next.build: "Build a version of this dataset."
  next.check: "Read the version's checks and what each one means."
  next.publish: "Publish the version; its approval re-runs every check first."

  # -- the approval's four facts (FR-004.15) ------------------------------------------------------
  approval.summary: "Publish version {number} of dataset {dataset} to {repo_id} as {visibility_upper}. What happens: miDataworks re-runs every check, uploads {files} files ({rows} rows) and verifies them. Cost: no money; the data leaves this installation for your Hub account. Where: miDataworks, Approvals, request {approval_id}. Then: miDataworks runs it once approved; ask for the status."

  # -- licences (FTID I1): plain words by the id miDataworks returns ------------------------------
  licence.cc-by-4.0: "you may share it, with credit"
  licence.cc-by-sa-4.0: "you may share it, with credit and under the same licence"
  licence.cc0-1.0: "you may share it freely"
  licence.mit: "you may share it, keeping the licence notice"
  licence.apache-2.0: "you may share it, keeping the licence notice"
  licence.odc-by: "you may share it, with credit"
  licence.cc-by-nc-4.0: "you may share it with credit, not for commercial use"
  licence.cc-by-nc-sa-4.0: "you may share it with credit, not for commercial use"
  licence.unknown: "read it before sharing"

  # -- the publish checks (FR-004.13; miDataworks docs/publishing.md) -----------------------------
  check.c-1.beginner: "C-1 licence: whether the source's licence lets you share this data."
  check.c-1.expert: "C-1 licence"
  check.c-2.beginner: "C-2 Hub access: whether the stored token can write to that repository."
  check.c-2.expert: "C-2 Hub access"
  check.c-3.beginner: "C-3 leakage: near-duplicate rows shared between training and held-out splits."
  check.c-3.expert: "C-3 leakage"
  check.c-4.beginner: "C-4 personal data: names, emails or numbers that identify a person."
  check.c-4.expert: "C-4 personal data"
  check.c-5.beginner: "C-5 audit: whether a person has looked at a sample of the rows."
  check.c-5.expert: "C-5 audit"
  check.c-6.beginner: "C-6 labels: whether the labels agree when checked twice."
  check.c-6.expert: "C-6 labels"
  check.c-7.beginner: "C-7 shortcut: whether one column alone predicts the label, so a model could learn it instead of the content."
  check.c-7.expert: "C-7 shortcut"
  check.c-8.beginner: "C-8 known answers: whether the labelling was compared with rows whose answers are known."
  check.c-8.expert: "C-8 known answers"
  check.c-9.beginner: "C-9 diversity: whether the rows cover the range they should."
  check.c-9.expert: "C-9 diversity"
  outcome.green: "green"
  outcome.note: "note"
  outcome.amber: "amber"
  outcome.refused: "refused"
  outcome.not_run: "not run yet"

  # -- refusals and teaching errors (the A13 layout is Core's) ------------------------------------
  error.hf_timeout: "The Hub did not answer in time."
  error.hf_timeout_fix: "Try again in a moment; nothing was changed."
  error.build_empty_fix: "Look at the drop reason, then build from another source or with an expert recipe."
  error.source_not_found: "No source in miDataworks has that name or id, and it is not a Hub repository id."
  error.plan_invalid: "miDataworks' build plan says the recipe does not fit this source."
  error.dataset_not_found: "miDataworks has no dataset with that name or id."
  error.version_not_built: "That dataset has no built version yet."
  error.files_failed: "miDataworks could not build the files of this version (build {build_id} is {status}). Look at it in miDataworks, Versions; the check and the publish wait for the files."
  error.check_run_not_found: "miDataworks has no publish-check run with that id."
  error.approval_not_found: "miDataworks has no approval with that id."
  status.unavailable: "miDataworks is not answering, so where this dataset stands cannot be read now."
  status.unreadable: "miDataworks could not read this dataset just now."
