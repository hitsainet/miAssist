# The words of the steering playbook (005 FPRD §4, §5; FTID §3.1; A8, A25), by key. One words file
# (OVN-miassist-pb045-2): definition keys, states, waits, the verdict, approvals, hand-offs, ends.
# FR-005.14: no verdict says a feature controls, causes or represents a concept; labels are
# machine-written; no strength is called safe.
version: 1
texts:
  steering.title: "Steer a model with a feature"
  steering.goal: "Find a [[feature]] for a concept, see how replies change as it is turned up, save a [[cluster]] with a dial from 0 to 1, and hand it to the operator to serve."
  steering.find.title: "Find a feature"
  steering.find.beginner: "Name a concept in plain words. miAssist searches the features of your finished extractions and lists the best matches with their machine-written labels, how often they fire and their highest activation. It only reads."
  steering.find.expert: "Feature search over the newest completed extractions."
  steering.find.done: "At least one candidate feature was found."
  steering.try.title: "Try it at several strengths"
  steering.try.beginner: "miAssist asks the operator to approve one GPU run that answers your prompt with the feature turned up at five [[steering-strength]]s, then shows how fluent each reply stays. A reply with fewer than 4 distinct words in 10 counts as fallen apart."
  steering.try.expert: "One approved sweep (file-first), then the fluency verdict per strength."
  steering.try.done: "The sweep ran and its replies were read."
  steering.save.title: "Save a cluster"
  steering.save.beginner: "Save the feature, or two or three of them, at a fluent strength as a [[cluster]] with a dial from 0 to 1. Several features are checked together first, through one more approved GPU run."
  steering.save.expert: "Cluster profile, dial [0, 1.0]; a combined check for 2-3 features."
  steering.save.done: "The cluster profile is saved."
  steering.serve.title: "Serve it"
  steering.serve.beginner: "Import the cluster into the inference server without switching it on, load its model if the operator approves, try one short steered reply, and hand activation to the operator, who decides whether every reply is steered."
  steering.serve.expert: "Import (never active), gated model load, one bounded trial, activation hand-off."
  steering.serve.done: "The inference server reports the cluster active."

  state.nothing_found: "No feature found yet: describe a concept first."
  state.feature_chosen: "Candidates were found; try one next."
  state.sweep_waiting: "The sweep waits for the operator's approval."
  state.sweep_approved: "The sweep is approved; call the try again to run it."
  state.sweeping: "The sweep is running on the GPU."
  state.swept: "The sweep ran."
  state.combined_waiting: "The combined check waits for the operator's approval."
  state.combining: "The combined check is running on the GPU."
  state.saved: "The cluster {name} is saved."
  state.model_load_waiting: "Loading the model waits: for the operator's approval, then for the inference server to load it."
  state.awaiting_hub_import: "The cluster on the Hub is the operator's import."
  state.imported: "The cluster {name} is in the inference server, not active."
  state.awaiting_activation: "The cluster {name} is in the inference server; activating it is the operator's step."
  state.active: "The cluster {name} is active."
  state.rejected: "The operator turned the request down."
  state.expired: "The request expired before anyone decided it."
  state.failed: "The GPU run did not complete."

  wait.approval_wb: "Decide in miWorkbench, Approvals, request {approval_id}."
  wait.approval_sv: "Decide in miServer, Approvals, request {approval_id}."
  wait.model_loading: "The inference server is loading model {model}; ask for the status when it has loaded."
  wait.sweeping: "GPU task {task_id} is running; a few minutes is usual."
  wait.hub_import: "Import {repo} in miServer, Steering, Hub: the cluster hub reads the Hub with the server's own credential, so only the operator imports from it."

  label.unlabelled: "unlabelled feature {index}"
  find.line: "{n}. {label} (machine-written label), feature {index}: fires on {freq} of tokens, highest activation {max}."
  find.none: "No feature matched. Try other words."
  find.choose: "Try this feature with a prompt of yours."
  try.again: "Ask again with ask_again, if you still want the run."
  try.read_later: "Read the sweep's result when the GPU task finishes."
  verdict.rule: "Rule: a reply with fewer than 4 distinct words in 10 (TTR below 0.4) counts as fallen apart."
  verdict.row: "Strength {strength}: TTR {ttr}, {state}."
  verdict.fluent: "fluent"
  verdict.collapsed: "fallen apart"
  verdict.usable: "With this feature turned up to {strength}, replies stayed fluent; the machine-written label reads {label}."
  verdict.none_fluent: "Every strength made replies fall apart; a gentler sweep comes next."
  verdict.try_gentler: "Sweep again at gentler strengths."
  verdict.save: "Save the feature at the fluent strength (give the cluster a name)."
  saved.serve: "Serve the saved cluster."
  next.continue: "Continue the playbook."
  end.serving: "Serving it"
  end.saved_here: "The saved cluster is in miWorkbench."

  approval.sweep: "Run one GPU sweep of {label} at {n} strengths on your prompt. Cost: one GPU run of about five short replies on {model}. Where: miWorkbench, Approvals. Then: call the try again with the approval id once approved."
  approval.combined: "Run one GPU check of {n} features together on your prompt. Cost: one GPU run of a short reply and a baseline. Where: miWorkbench, Approvals. Then: call the save again with the approval id once approved."
  approval.model_load: "Load model {model} in the inference server. Cost: GPU memory while it stays loaded; it replaces the model loaded now. Where: miServer, Approvals, request {approval_id}. Then: miServer loads it once approved; ask for the status."

  handoff.cluster: "Activating {name} is the operator's step, in miServer, Steering: once active it steers every reply the server gives, and replaces the cluster active now."
  handoff.circuit: "Activating circuit {name} (evidence rung {rung}) is the operator's step, in miServer, Steering: once active it steers every reply."
  handoff.below_rung2: "Its evidence is below rung 2, so miServer asks the operator to acknowledge that first."

  error.feature_not_found: "miWorkbench has no feature with that id."
  error.gate_not_ready: "This miWorkbench does not take an approved steering run from miAssist yet."
  error.gate_not_ready_fix: "The operator runs the sweep in miWorkbench, Steering, until the update that lets miAssist file it."
  error.no_max: "This feature reports no real highest activation, so miAssist cannot pick strengths for it."
  error.no_max_fix: "Choose another feature, or give strengths yourself."
  error.sweep_failed: "The GPU run failed: {reason}"
  error.needs_strength: "Each feature needs a strength from its sweep."
  error.needs_strength_fix: "Give each feature's fluent strength from the try's result."
  error.one_sae: "The features of one cluster must come from the same [[sae]]."
  error.needs_prompt: "Two or three features are checked together first, so a prompt is needed."
  error.combined_not_fluent: "Together these features made the reply fall apart (TTR {ttr}), so nothing was saved."
  error.circuit_not_found: "That circuit was not found."
  error.cluster_not_found: "That cluster was not found."
  error.serve_one: "Name exactly one of a cluster, a circuit or a Hub repository."
  error.request_refused: "miWorkbench would refuse this request: {detail}"
  error.request_refused_fix: "Change the value it names; nothing was filed."
  error.sae_mismatch: "The inference server has [[sae]] {attached} attached, not {served}."
  error.sae_mismatch_fix: "The operator attaches the cluster's [[sae]] in miServer; miAssist never does."
  error.task_unreadable: "miWorkbench answered GPU task {task_id} in a shape miAssist cannot read, so its result is not shown."
  error.task_unreadable_fix: "Read the task in miWorkbench, Steering; nothing more was sent."
  error.combined_mismatch: "GPU task {task_id} did not steer exactly these features, so it cannot check them."
  error.combined_mismatch_fix: "Save without the task id, or with the task id of this combined check."
  error.import_refused: "miServer did not import {name}: {reason}"
  error.model_unknown: "The cluster does not name its model, so miAssist cannot check that the inference server serves it."
  error.model_unknown_fix: "Export the cluster again from miWorkbench with its model, then serve it."
  error.model_not_downloaded: "The inference server has no model {model} downloaded; downloading one is the operator's."
  error.model_not_downloaded_fix: "The operator downloads {model} in miServer, Models; then serve again."
  error.trial_no_features: "The cluster has no member miAssist can steer with, so no trial was run: an unsteered reply would not be this cluster's."
  error.model_not_resident: "The model is not loaded in the inference server, and a trial never loads one."
  status.unavailable: "An app is not answering, so where this stands cannot be read now."
