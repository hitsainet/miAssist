# The words of the detector-probe playbook (003 FPRD §4, §5.1, §5.4; A8, A25). The definition
# (playbooks/definitions/detector-probe.json) names the detector.* keys; the tools read the rest.
# Definition texts name no app (a step runs with any of its apps, and an absent app is never
# mentioned outside Core's honest-end form, FR-003.5). Names of sets, models and datasets are app
# text and appear only in data; these texts refer to them by role (FPRD §4.5).
version: 1
texts:
  detector.title: "Build a behaviour detector"
  detector.goal: "Go from \"I want to catch this in my model's traffic\" to a [[detector]] that is trained, honestly evaluated, imported for serving and armed by the operator."
  detector.describe.title: "Describe the behaviour"
  detector.describe.beginner: "Say in plain words what the detector should catch. miAssist proposes a [[behaviour-key]], the [[positive-meaning]] and a starting [[false-alarm]] rate, with a reason for each, and records the behaviour once you confirm."
  detector.describe.expert: "Catalogue the behaviour: key, meanings, target false-alarm rate."
  detector.describe.done: "The behaviour has a key and is recorded."
  detector.data.title: "Get labelled data"
  detector.data.beginner: "Bring a labelled dataset you already have, or build one step by step in the dataset app. miAssist registers the [[view]]s the detector needs: training, testing, a set of [[everyday-text]] and a set of [[nonsense-text]], and reports how many examples each holds."
  detector.data.expert: "Register train, test, bar-setting, everyday-text and nonsense-text views (own data), or follow the dataset journey to a checked send."
  detector.data.done: "Every view the detector needs is registered."
  detector.train.title: "Train the detector"
  detector.train.beginner: "miAssist proposes the model and training choices with reasons, asks the operator to approve the [[gpu]] run in plain words, and starts it once approved."
  detector.train.expert: "Rule recommendation, forecast, one GPU approval, one run."
  detector.train.done: "A training run finished and produced probes."
  detector.verdict.title: "Get an honest verdict"
  detector.verdict.beginner: "The detector is tested on every registered set, after the operator approves the [[gpu]] work. The verdict states its [[rung]] and the numbers behind it, and the one step that would raise it."
  detector.verdict.expert: "Evaluate on every view; rung, catch rate, false alarms per 1,000, [[auroc]] interval."
  detector.verdict.done: "The probe has a rung from an evaluation on every registered set."
  detector.deploy.title: "Deploy and arm it"
  detector.deploy.beginner: "The detector's definition is built, after the operator approves it, and imported for serving. Then the operator checks [[parity]] and arms it; miAssist never arms a detector itself. Once [[armed]], the status shows how often it fires."
  detector.deploy.expert: "Build the definition (approved), import it; parity and arming are the operator's."
  detector.deploy.done: "The detector is armed on live traffic."

  # -- step states: what happened / why it matters / what good looks like / next (FTDD §7) --
  state.undescribed.what: "No behaviour with this key is recorded yet."
  state.undescribed.why: "Every later step hangs off the behaviour's key."
  state.undescribed.good: "A short key and a plain meaning you agree with."
  state.undescribed.next: "Describe the behaviour."
  state.proposed.what: "miAssist proposed a key, the meanings and a starting false-alarm rate. Nothing is recorded yet."
  state.proposed.why: "These choices are yours; the detector is judged against them."
  state.proposed.good: "Choices you would explain the same way to a colleague."
  state.proposed.next: "Confirm the proposal, or call again with your own values."
  state.described.what: "The behaviour is recorded under its key."
  state.described.why: "The data, the training and the verdict all refer to it."
  state.described.good: "A key that names the behaviour and a meaning that says when it is present."
  state.described.next: "Bring labelled data for it."
  state.awaiting_download.what: "The dataset is not here yet, and miAssist can fetch only a public dataset of known, moderate size. This one is the operator's to download."
  state.awaiting_download.why: "A private, gated, unverified or very large dataset needs the operator's own decision and credentials."
  state.awaiting_download.good: "The operator downloads it in the app's Datasets page; then the journey carries on."
  state.awaiting_download.next: "Ask the operator to download it, then call this step again."
  state.dataset_downloading.what: "The public dataset is downloading."
  state.dataset_downloading.why: "The views are registered over the downloaded copy."
  state.dataset_downloading.good: "The download finishes within minutes for a moderate dataset."
  state.dataset_downloading.next: "Call this step again in a little while."
  state.labels_unmapped.what: "Some label values are not mapped to positive or negative."
  state.labels_unmapped.why: "Every example must count as a positive or a negative; miAssist never guesses which."
  state.labels_unmapped.good: "Each listed value placed on the side you mean."
  state.labels_unmapped.next: "Call this step again with the values that mean positive."
  state.views_partial.what: "Some of the views the detector needs are registered; others are not yet."
  state.views_partial.why: "Training needs a training view and the verdict needs the test, everyday and nonsense views."
  state.views_partial.good: "All five roles registered, each with its counts."
  state.views_partial.next: "Call this step again to register the rest."
  state.dw_journey_step.what: "The dataset journey's next step is one you take in the dataset app."
  state.dw_journey_step.why: "Authoring choices such as rules, templates and reviews are yours, made where the data lives."
  state.dw_journey_step.good: "The step done in the app; the journey's status moves on."
  state.dw_journey_step.next: "Do the step in the dataset app, then ask for the status again."
  state.dw_send_waiting.what: "The send of the detector sets waits for the operator's approval."
  state.dw_send_waiting.why: "A send publishes data, so the operator decides it."
  state.dw_send_waiting.good: "The operator approves it; the app then runs the send by itself."
  state.dw_send_waiting.next: "Wait for the operator's decision, then ask for the status."
  state.dw_send_running.what: "The approved send is running."
  state.dw_send_running.why: "It registers the views the detector trains and is judged on."
  state.dw_send_running.good: "Each step of the send finishes and the views are registered."
  state.dw_send_running.next: "Ask for the status again in a little while."
  state.views_ready.what: "Every view the detector needs is registered."
  state.views_ready.why: "The detector can now be trained and judged on data you chose."
  state.views_ready.good: "Enough positives and negatives in each view to measure something."
  state.views_ready.next: "Train the detector."
  state.train_waiting.what: "The training run waits for the operator's approval in miWorkbench."
  state.train_waiting.why: "It holds a [[gpu]] for a while, so the operator decides it."
  state.train_waiting.good: "An approval the operator understands from its summary."
  state.train_waiting.next: "Once it is approved, call the training step again."
  state.train_approved.what: "The operator approved the training run; it starts on the next call."
  state.train_approved.why: "miAssist starts approved work only when you ask, with the approval it was given."
  state.train_approved.good: "One run started with that approval."
  state.train_approved.next: "Call the training step again to start it."
  state.training.what: "The detector is training."
  state.training.why: "Training fits a small classifier on the model's internal activity."
  state.training.good: "The run finishes in about the forecast time."
  state.training.next: "Ask for the status again later."
  state.trained.what: "The training run finished and picked its best probe."
  state.trained.why: "A trained probe is not yet known to work; the verdict measures that."
  state.trained.good: "A selected probe ready to evaluate."
  state.trained.next: "Get the verdict."
  state.verdict_waiting.what: "The evaluation waits for the operator's approval in miWorkbench."
  state.verdict_waiting.why: "It runs on a [[gpu]], so the operator decides it."
  state.verdict_waiting.good: "An approval the operator understands from its summary."
  state.verdict_waiting.next: "Once it is approved, call the verdict step again."
  state.verdict_approved.what: "The operator approved the evaluation; it starts on the next call."
  state.verdict_approved.why: "miAssist starts approved work only when you ask."
  state.verdict_approved.good: "One evaluation started with that approval."
  state.verdict_approved.next: "Call the verdict step again to start it."
  state.evaluating.what: "The detector is being evaluated on every registered set."
  state.evaluating.why: "The verdict rests on sets it never trained on."
  state.evaluating.good: "Every set scored."
  state.evaluating.next: "Ask for the verdict again in a little while."
  state.judged.what: "The detector has a verdict."
  state.judged.why: "The [[rung]] says how far the evidence goes; the numbers say why."
  state.judged.good: "Rung 2 or more before it serves live traffic."
  state.judged.next: "Deploy it, or raise the rung first."
  state.deploy_waiting.what: "Building the detector's definition waits for the operator's approval in miWorkbench."
  state.deploy_waiting.why: "Building it runs on a [[gpu]], so the operator decides it."
  state.deploy_waiting.good: "An approval the operator understands from its summary."
  state.deploy_waiting.next: "Once it is approved, call the deploy step again."
  state.deploy_approved.what: "The operator approved building the definition; it starts on the next call."
  state.deploy_approved.why: "miAssist starts approved work only when you ask."
  state.deploy_approved.good: "One build started with that approval."
  state.deploy_approved.next: "Call the deploy step again to start it."
  state.deploy_building.what: "The detector's definition is being built."
  state.deploy_building.why: "The serving app imports this definition, not the training run."
  state.deploy_building.good: "A built definition, ready to import."
  state.deploy_building.next: "Call the deploy step again in a little while."
  state.awaiting_hub_import.what: "The detector named on the Hub is the operator's to import, on the serving app's Probes page."
  state.awaiting_hub_import.why: "A Hub import reads with the server's own credential, so miAssist leaves it to the operator."
  state.awaiting_hub_import.good: "The probe listed by the serving app; the journey then carries on."
  state.awaiting_hub_import.next: "Ask the operator to import it, then call the deploy step again."
  state.awaiting_arm.what: "The detector is imported for serving and waits for the operator to check [[parity]] and arm it."
  state.awaiting_arm.why: "Arming changes what happens to live traffic, so only the operator does it."
  state.awaiting_arm.good: "Parity checked, then armed by the operator."
  state.awaiting_arm.next: "Ask the operator to run parity and arm it, then ask for the status."
  state.watching.what: "The detector is [[armed]] and scoring live traffic."
  state.watching.why: "The counts show how often it fires; no message text is shown."
  state.watching.good: "Firing about as often as the behaviour really occurs."
  state.watching.next: "Check the status now and then."
  state.watching.counts: "In the last 24 hours it fired {fired} times, did not fire {not_fired} times and could not score {not_scored} times."
  state.watching.paused: "The serving app says it is not scoring: {reason}."
  state.rejected.what: "The operator declined the request."
  state.rejected.why: "Nothing ran; the operator's decision stands."
  state.rejected.good: "Their reason, if they gave one, says what to change."
  state.rejected.next: "Change the request, then ask again with ask_again."
  state.expired.what: "The request expired before the operator decided it."
  state.expired.why: "Nothing ran."
  state.expired.good: "A fresh request when the operator is around."
  state.expired.next: "Ask again with ask_again."
  state.failed.what: "The approved work failed in the app."
  state.failed.why: "The app's reason says what went wrong; nothing is retried by itself."
  state.failed.good: "The cause fixed, then the step asked for again."
  state.failed.next: "Read the reason, fix it, then ask again with ask_again."
  state.data_checked.what: "The detector's data is built and checked."
  state.data_checked.why: "Checked sets are what a detector is trained and judged on."
  state.data_checked.good: "Every set checked and passed."
  state.data_checked.next: "Nothing more to do here in this installation."

  # -- the honest ends (FPRD §5.3; Core renders the absent-app sentence, A25) --
  end.data.done: "Your detector's data is built and checked."
  end.data.step: "Training it"
  end.verdict.done: "Your detector is evaluated."
  end.verdict.step: "Serving it"
  end.form: "{done} {step} {honest_end}."

  # -- the reasons for proposed defaults (FR-003.14, FR-003.8, Q12) --
  reason.key: "A short name made from your description, used to find everything for this detector."
  reason.key_taken: "That key is already used, so miAssist proposes a free one."
  reason.meaning: "Taken from your description; the detector is judged against it."
  reason.target_fpr: "About 1 false alarm in 100 ordinary messages is the starting bar; rung 2 checks it on everyday text."
  reason.rules: "The training view's evidence decides which [[pooling-rule]]s fit, so the app's own recommendation is followed."
  reason.layers: "Layers spread through the model are tried and the best one is kept."
  caution.unmapped: "{rows} rows have a label value that no mapping names, so miWorkbench left them out of the views."
  reason.eval_rows: "Each test set is scored on at most 20,000 rows, so no set is too large to run; a smaller set is scored whole."
  reason.calibration_rows: "Enough ordinary messages to set the bar."
  reason.gpu: "A free card is picked."
  reason.model_one: "The one model ready for this."
  reason.model_many: "More than one model fits; pick one."
  reason.route: "Use data you already have, or build it in the dataset app."
  reason.adopt: "This key is already recorded. Use that behaviour, or choose another key."
  reason.below_rung2: "Below rung 2 the definition is built only with your own reason for going ahead; say it in your own words."
  reason.positive_values: "The values that mean the behaviour is present; every other value counts as negative."

  # -- choice titles (forms and teaching fallbacks, FR-003.16) --
  choice.confirm: "Record it as proposed?"
  choice.confirm_yes: "Yes, as proposed"
  choice.confirm_no: "No, I will change it"
  choice.model: "Which model?"
  choice.route: "Where does the data come from?"
  choice.route_own: "My own labelled data"
  choice.route_build: "Build it with the dataset app"
  choice.adopt: "Use the existing behaviour?"

  # -- approvals in four facts (FR-003.21): what, cost, where, how to resume --
  approval.training.what: "Train the detector on a [[gpu]]: it reads the training examples through the model and fits a small classifier per layer."
  approval.training.cost: "About {minutes} minutes of one GPU and {gib} GiB of host memory; other GPU jobs wait behind it."
  approval.training.where: "miWorkbench, Approvals page, request {id}."
  approval.training.resume: "Say continue, or call the training step again with the same key, once the operator has approved it."
  approval.evaluation.what: "Evaluate the detector on a [[gpu]] on every registered set."
  approval.evaluation.cost: "{sets} sets scored on one GPU; other GPU jobs wait behind it."
  approval.evaluation.where: "miWorkbench, Approvals page, request {id}."
  approval.evaluation.resume: "Say continue, or call the verdict step again with the same key, once the operator has approved it."
  approval.definition.what: "Build the detector's definition on a [[gpu]], so it can be imported for serving."
  approval.definition.cost: "A short GPU job."
  approval.definition.where: "miWorkbench, Approvals page, request {id}."
  approval.definition.resume: "Say continue, or call the deploy step again with the same key, once the operator has approved it."
  approval.send.what: "Send the detector sets: publish them and register their views for training."
  approval.send.cost: "Data leaves this machine for the Hub, as a {visibility} repository."
  approval.send.where: "miDataworks, Approvals page, request {id}."
  approval.send.resume: "The app runs it once approved; ask for the status to follow it."
  approval.summary: "{what} {cost} Where: {where} Then: {resume}"

  # -- hand-offs to the operator (operator_action, A14, A16) --
  handoff.download: "The operator downloads the dataset in miWorkbench, on the Datasets page."
  handoff.everyday: "Name a set of everyday text with everyday_view, or ask the operator to configure one."
  handoff.arm: "In miServer, on the Probes page: open the probe, run parity, then arm it. Arming makes miServer score every chat for this behaviour and record the verdicts; below rung 2 it asks the operator for their own acknowledgement."
  handoff.hub_import: "In miServer, on the Probes page, the operator imports the probe from the Hub."
  handoff.dw_step: "In miDataworks, take the step shown in the journey."
  dw.check_refused: "miDataworks ran the detector sets' checks before sending, and one refuses: {reason}. Fix it in miDataworks, Detector sets, then ask again; nothing was sent."
  dw.send_confirm: "{n} detector set(s) are ready to send. When every set you want sent exists (the main set and one per sub-question), call again with confirm: true; miDataworks checks them before filing, then the operator approves the send."
  dw.send_confirm.next: "Once every detector set you want sent exists, send them with confirm: true."
  error.set_unchecked: "miAssist could not read which versions detector set {set_id} would publish, so it sends nothing."

  # -- the dataset journey's steps, explained (FTASKS 7.1; ids from the dataset app's journey) --
  dw.resolve: "The behaviour's definition is read and recorded."
  dw.rule_set: "Write the rules that say what counts as the behaviour, in the dataset app's Rule sets page."
  dw.templates: "Write the generation templates that describe the messages to make."
  dw.recipe: "Save a recipe: which sources and templates make the dataset, and in what mix."
  dw.plan: "Check the plan for the generation: how many rows, from where, at what cost."
  dw.generation: "Start the generation run in the dataset app; it chooses the endpoint and its cost."
  dw.build: "Build a version of the dataset from the recipe."
  dw.second_opinion: "Have a second labeller judge the rows."
  dw.agreement: "Read how far the two labellers agree."
  dw.review: "Review the rows the labellers disagree on."
  dw.sets: "Make the detector sets: training, testing and the other roles."
  dw.check: "Run the checks on the detector sets."
  dw.send: "Send the detector sets; the operator approves the send."

  # -- the verdict (FR-003.17, FR-003.18; §4.2). Overclaim words appear only in verdict.ready --
  verdict.r0: "Your detector is at [[rung]] 0: it has not yet shown that it separates positives from negatives."
  verdict.r1: "Your detector reached [[rung]] 1: it works on data like its training data. It has not been shown to work on data from a different source, so it may miss the behaviour worded differently."
  verdict.r2: "Your detector reached [[rung]] 2: it works on data from sources it never trained on."
  verdict.r3: "Your detector reached [[rung]] 3: it works on data from new sources and a second opinion agrees."
  verdict.ood_line: "On a set from a different source it caught {rate}% of positives at its [[shipped-bar]] ({caught} of {positives}; it needs at least {needed})."
  verdict.everyday_line: "On [[everyday-text]] it raised {per_thousand} [[false-alarm]]s per 1,000 messages (allowed: up to {allowed_per_thousand})."
  verdict.nonsense_line: "On [[nonsense-text]] it raised {per_thousand} false alarms per 1,000 messages (allowed: up to {allowed_per_thousand})."
  verdict.not_counted: "One set did not count towards the verdict: {note}."
  verdict.auroc_line: "The lower end of its [[auroc]] interval is {low} on its weakest set; above 0.5 means better than chance."
  verdict.no_ood: "No set from a different source was evaluated, so the verdict stops at rung 1."
  verdict.ready: "It is ready to serve."
  verdict.caveat: "The bar was set on the split it was tested on; the figures on that split are flattered, the checks on other sources and on everyday text are not."
  verdict.next.r0: "Next: check the labels and the training view, then train again."
  verdict.next.r1: "Next: add an evaluation set from a different source (ood_hf_repo) and run the verdict again."
  verdict.next.r2: "Next: deploy it."
  verdict.next.r3: "Next: deploy it."
  verdict.expert: "rung {rung} · [[out-of-distribution]] catch {ood} · everyday {everyday} · nonsense {nonsense} · [[auroc]] CI low {low} · next: {next}"
