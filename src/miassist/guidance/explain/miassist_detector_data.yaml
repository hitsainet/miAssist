# The detector-probe playbook's results (003 FPRD §4.1): the words of each state live in
# guidance/playbooks/detector-probe.yaml (state.<name>.*) and fill these slots.
version: 1
outcomes:
  state:
    what_happened: "{what}"
    why_it_matters: "{why}"
    what_good_looks_like: "{good}"
    next_step: "{next}"
  unavailable:
    what_happened: miAssist could not reach {app_name}, so it changed nothing.
    why_it_matters: This step needs {app_name}; nothing was guessed while it is away.
    what_good_looks_like: The app answering on a later try.
    next_step: Check miassist_status later; do not retry in a loop.
