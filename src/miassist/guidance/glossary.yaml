# The glossary (001 FR-9; A8). Every [[key]] marker in guidance text names an entry here.
version: 1
entries:
  - {key: approval, term: approval, aliases: [approvals, pending approval], plain: "A request an app holds until its operator says yes or no. You cannot approve it; the operator decides in the app.", short: "An operator decision an app requires before it acts.", see_also: [guidance-level]}
  - {key: auroc, term: AUROC, aliases: [area under the curve], plain: "A score from 0.5 (guessing) to 1.0 (perfect) for how well a probe tells the two kinds of text apart.", short: "Area under the ROC curve.", good: "0.9 or above on text the probe never saw.", see_also: [probe, held-out]}
  - {key: calibration-bar, term: calibration bar, aliases: [threshold, bar], plain: "The score above which a probe says yes, chosen so it rarely raises a false alarm.", short: "The decision threshold set from calibration data.", see_also: [false-alarm]}
  - {key: checkpoint, term: checkpoint, aliases: [checkpoints], plain: "A saved copy of model weights at one point in a training run.", short: "Saved weights from a run step."}
  - {key: circuit, term: circuit, aliases: [circuits], plain: "A small set of model parts that work together to produce one behaviour.", short: "A causal subgraph of features and edges.", see_also: [feature, rung]}
  - {key: cluster, term: cluster, aliases: [clusters, feature cluster], plain: "A group of features steered together as one dial.", short: "A named feature group with strengths.", see_also: [steering]}
  - {key: dataset-version, term: dataset version, aliases: [version, versions], plain: "A frozen, numbered copy of a dataset that does not change after it is built.", short: "An immutable dataset build."}
  - {key: detector, term: detector, aliases: [detectors], plain: "Something that watches a model's activity and flags one kind of behaviour.", short: "A probe or rule set that flags a behaviour.", see_also: [probe]}
  - {key: evidence-ladder, term: evidence ladder, aliases: [ladder], plain: "The steps of proof a result climbs, from a first guess to a tested claim.", short: "The rung scale of evidence.", see_also: [rung]}
  - {key: false-alarm, term: false alarm, aliases: [false alarms, false positive], plain: "When a detector says yes about text that is fine.", short: "A false positive."}
  - {key: feature, term: feature, aliases: [features, SAE feature], plain: "One direction inside a model that lights up for a recognisable idea.", short: "A learned dictionary direction.", see_also: [sae]}
  - {key: gpu, term: GPU, aliases: [GPUs, graphics card], plain: "The fast processor(s) that run models. Work that uses the GPU(s) available always waits for the app's operator.", short: "The accelerator(s) available."}
  - {key: guidance-level, term: guidance level, aliases: [level, beginner, expert], plain: "Beginner shows a short explanation with each result; expert leaves it out. Nothing else changes.", short: "beginner or expert: only the explanation differs."}
  - {key: held-out, term: held-out, aliases: [held out, holdout], plain: "Data kept aside and never used for training, so a test on it is fair.", short: "Unseen evaluation data."}
  - {key: label-run, term: label run, aliases: [label runs, labelling], plain: "A pass that labels each row of a dataset, by rules or by a judge model.", short: "A dataset labelling job."}
  - {key: out-of-distribution, term: out-of-distribution, aliases: [OOD, out of distribution], plain: "Text unlike the training text, used to check a probe still works away from home.", short: "A distribution-shifted evaluation set.", see_also: [held-out]}
  - {key: pack, term: pack, aliases: [packs], plain: "A bundle of the parts a training run needs: the data, the settings and the model to start from.", short: "A training run's input bundle."}
  - {key: pooling-rule, term: pooling rule, aliases: [pooling], plain: "How a probe turns many per-word scores into one score for a whole text.", short: "Token-to-sequence aggregation.", see_also: [probe]}
  - {key: probe, term: probe, aliases: [probes, probe monitor], plain: "A small classifier that reads a model's activity and scores one behaviour.", short: "A linear activation classifier.", see_also: [detector, auroc]}
  - {key: recipe, term: recipe, aliases: [recipes], plain: "The saved steps that build a dataset version from its sources.", short: "A dataset build specification.", see_also: [dataset-version]}
  - {key: rung, term: rung, aliases: [rungs, rung 2], plain: "One step on the evidence ladder; a higher rung means stronger proof.", short: "An evidence level.", see_also: [evidence-ladder]}
  - {key: sae, term: SAE, aliases: [sparse autoencoder, SAEs], plain: "A tool that splits a model's activity into many readable features.", short: "Sparse autoencoder.", see_also: [feature]}
  - {key: served-model, term: served model, aliases: [loaded model, model], plain: "The model the inference server has loaded and answers chat requests with.", short: "The inference server's resident model."}
  - {key: steering, term: steering, aliases: [steer], plain: "Nudging a model's behaviour by turning features up or down while it answers.", short: "Activation steering.", see_also: [steering-strength, cluster]}
  - {key: steering-strength, term: steering strength, aliases: [strength, intensity], plain: "How hard a steering nudge pushes; too much makes answers strange.", short: "The steering coefficient.", see_also: [steering]}
  - {key: armed, term: armed, aliases: [arm, arming], plain: "A detector the serving app runs on every chat, recording a verdict each time.", short: "Scoring live traffic.", see_also: [detector, parity]}
  - {key: behaviour-key, term: behaviour key, aliases: [key, behavior key], plain: "A short name, like refund-request, that ties a behaviour's data, runs and detectors together.", short: "The behaviour's name.", see_also: [detector]}
  - {key: catch-rate, term: catch rate, aliases: [recall], plain: "The share of real positives the detector flags at its bar.", short: "Positives caught at the bar.", see_also: [shipped-bar]}
  - {key: everyday-text, term: everyday text, aliases: [everyday set], plain: "Ordinary messages that should not set the detector off; they measure false alarms.", short: "Ordinary messages.", see_also: [false-alarm]}
  - {key: nonsense-text, term: nonsense text, aliases: [nonsense set], plain: "Made-up, meaningless text; a good detector stays quiet on it.", short: "Meaningless text.", see_also: [false-alarm]}
  - {key: parity, term: parity, aliases: [parity check], plain: "A check that the serving app scores text the same way the training app did.", short: "Same scores in both apps.", see_also: [armed]}
  - {key: positive-meaning, term: positive meaning, aliases: [meaning], plain: "What it means, in plain words, for the behaviour to be present in a message.", short: "When the behaviour is present.", see_also: [behaviour-key]}
  - {key: shipped-bar, term: shipped bar, aliases: [bar, threshold], plain: "The score above which the detector says yes, set from ordinary messages.", short: "The decision threshold.", see_also: [calibration-bar]}
  - {key: view, term: view, aliases: [views, probe dataset], plain: "A dataset read one way: which column is the text, which the label, and what each label means.", short: "A labelled reading of a dataset."}
  # 004 dataset playbook (FPRD §5.4)
  - {key: source, term: source, aliases: [sources, data source], plain: "Data brought into the dataset app as it is, from the Hub or an upload, before any recipe runs.", short: "Imported raw data.", see_also: [dataset]}
  - {key: dataset, term: dataset, aliases: [datasets], plain: "A named collection whose numbered versions are built from sources by a recipe.", short: "A versioned collection of rows.", see_also: [dataset-version, source]}
  - {key: operator-step, term: recipe step, aliases: [operator step], plain: "One step of a recipe, such as dropping duplicates or making splits; each has its own version and settings.", short: "A recipe operator.", see_also: [recipe]}
  - {key: split, term: split, aliases: [splits, train split, test split], plain: "A named part of a dataset, such as train, validation or test.", short: "A dataset partition.", see_also: [held-out-split]}
  - {key: held-out-split, term: held-out split, aliases: [held-out splits], plain: "A split kept apart for judging a model on rows it never learned from.", short: "An evaluation split.", see_also: [split, leakage]}
  - {key: duplicate, term: duplicate, aliases: [duplicates, exact duplicate], plain: "A row that is exactly the same as another row.", short: "An identical row.", see_also: [near-duplicate]}
  - {key: near-duplicate, term: near-duplicate, aliases: [near-duplicates], plain: "A row that is almost the same as another, differing only in small ways.", short: "A nearly identical row.", see_also: [duplicate, leakage]}
  - {key: leakage, term: leakage, aliases: [data leakage], plain: "The same or nearly the same rows in both training and held-out splits, which makes a model look better than it is.", short: "Train/test overlap.", see_also: [held-out-split, near-duplicate]}
  - {key: shortcut, term: shortcut, aliases: [shortcuts, shortcut audit], plain: "A column that alone predicts the label, so a model could learn that column instead of the content.", short: "A spurious predictive feature.", see_also: [publish-check]}
  - {key: publish-check, term: publish check, aliases: [publish checks, check run], plain: "One of the checks a dataset passes before it is published, numbered C-1 to C-9, each ending green, note, amber or refused.", short: "A pre-publication check.", see_also: [check-outcome]}
  - {key: check-outcome, term: check outcome, aliases: [green, note, amber, refused], plain: "How a publish check ended: green passed; note is for your information; amber blocks a public publish only; refused blocks every publish.", short: "green, note, amber or refused.", see_also: [publish-check]}
  - {key: visibility, term: visibility, aliases: [private, public], plain: "Who can see a published dataset: private means only your Hub account; public means anyone.", short: "private or public."}
  # 005 steering playbook (FPRD §5.4)
  - {key: layer, term: layer, aliases: [layers], plain: "One stage of the model's stack; a feature lives at one layer.", short: "A transformer block index."}
  - {key: max-activation, term: max activation, aliases: [highest activation], plain: "The strongest response a feature showed on the examples it was measured on; steering strengths are scaled from it.", short: "A feature's peak activation.", see_also: [steering-strength]}
  - {key: sweep, term: sweep, aliases: [steering sweep], plain: "One run that answers the same prompt with a feature turned up to several strengths, to compare the replies.", short: "A multi-strength steering run.", see_also: [steering-strength]}
  - {key: fluent, term: fluent, aliases: [fluency, fallen apart], plain: "A reply that still reads as language; one with fewer than 4 distinct words in 10 counts as fallen apart.", short: "Type-token ratio at least 0.4.", see_also: [type-token-ratio]}
  - {key: type-token-ratio, term: type-token ratio, aliases: [TTR], plain: "Distinct words divided by all words in a reply; repetition drives it down.", short: "Lexical diversity.", see_also: [fluent]}
  - {key: dial, term: dial, aliases: [intensity dial], plain: "How much of a saved cluster is applied, from 0 (off) to 1 (the saved strengths).", short: "Cluster intensity in [0, 1].", see_also: [cluster]}
  - {key: activate, term: activate, aliases: [activation, active], plain: "Switching a cluster on in the inference server so it steers every reply; the operator does it.", short: "Serve-wide steering on.", see_also: [cluster]}
  - {key: trial, term: per-request trial, aliases: [trial], plain: "One short reply steered by a cluster for that request only, without switching it on for anyone else.", short: "Inline steering for one request.", see_also: [activate]}
